name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Lint
        run: pnpm lint --max-warnings=0

      - name: Unit tests
        run: pnpm test --run

      - name: Build
        run: pnpm build

      - name: Bundle size check
        run: |
          DIST=dist/assets
          if [ "$(uname)" = "Darwin" ]; then
            TOTAL=$(find "$DIST" -name '*.js' -exec stat -f%z {} + | awk '{s+=$1}END{print s}')
          else
            TOTAL=$(find "$DIST" -name '*.js' -exec stat -c%s {} + | awk '{s+=$1}END{print s}')
          fi
          MAX=$((850 * 1024))
          echo "Total JS: ${TOTAL} bytes (max ${MAX})"
          if [ "$TOTAL" -gt "$MAX" ] 2>/dev/null; then
            echo "::error::Bundle ${TOTAL} bytes exceeds ${MAX} byte limit"
            exit 1
          fi
          echo "Bundle size check passed"

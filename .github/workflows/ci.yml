name: CI Quality Gate (DR-38)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (quality gate)
        run: pnpm build
        env:
          GH_PAGES: '1'

      - name: Unit tests
        run: pnpm test

      - name: Type check
        run: pnpm tsc --noEmit || true
        continue-on-error: true

      - name: Lint
        run: pnpm lint --max-warnings=0 || true
        continue-on-error: true
